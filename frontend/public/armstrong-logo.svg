<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ArmStrong logo</title>
  <desc id="desc">An original smiling, gender-neutral robot flexing a mechanical arm.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="116" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#293039"/>
      <stop offset="1" stop-color="#12171c"/>
    </linearGradient>
    <linearGradient id="metal" x1="35" y1="26" x2="78" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f8fb"/>
      <stop offset=".48" stop-color="#c7d1d8"/>
      <stop offset="1" stop-color="#7a8994"/>
    </linearGradient>
    <linearGradient id="teal" x1="71" y1="42" x2="109" y2="89" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63e0d1"/>
      <stop offset="1" stop-color="#169c92"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#05090c" flood-opacity=".55"/>
    </filter>
  </defs>
  <!-- Original strength-pose mark; it is not a reproduction of Rosie the Riveter artwork. -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <path d="M15 25 52 9M10 54 36 42M91 16l20 18" stroke="#3a4650" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  <g filter="url(#shadow)">
    <!-- Flexed robot arm, raised in a generic strength pose. -->
    <path d="M69 81c12 6 27 1 34-10 6-9 5-21-2-27-4-4-10-4-14 0l-8 8 9 9 5-5c2-2 5-2 7 1 3 4 2 10-1 14-5 7-15 9-23 5Z" fill="url(#teal)" stroke="#0e625d" stroke-width="3" stroke-linejoin="round"/>
    <path d="m79 52 9 9" stroke="#d7fffb" stroke-width="3" stroke-linecap="round"/>
    <circle cx="79" cy="52" r="7" fill="#1a2930" stroke="#79fff1" stroke-width="2"/>
    <path d="M93 39c1-8 7-12 13-11 7 2 10 8 8 15l-3 10-17-5Z" fill="url(#metal)" stroke="#687985" stroke-width="3" stroke-linejoin="round"/>
    <path d="m105 31 6 4m-10-7 3 7m9 4 4 3" stroke="#2ec4b6" stroke-width="2" stroke-linecap="round"/>
    <!-- Gender-neutral torso and shoulder. -->
    <path d="M38 80c0-10 9-18 20-18s20 8 20 18v24H38Z" fill="url(#metal)" stroke="#687985" stroke-width="3" stroke-linejoin="round"/>
    <path d="M42 83h32v10H42Z" fill="#18242b"/>
    <path d="M48 88h20" stroke="#2ec4b6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="75" cy="69" r="9" fill="#1b2930" stroke="#76e8db" stroke-width="3"/>
    <!-- Friendly robot head and face. -->
    <rect x="34" y="29" width="47" height="37" rx="16" fill="url(#metal)" stroke="#667783" stroke-width="3"/>
    <path d="M43 39h29c4 0 7 3 7 7v7c0 5-3 8-7 8H43c-5 0-8-3-8-8v-7c0-4 3-7 8-7Z" fill="#18252c"/>
    <circle cx="51" cy="49" r="3.5" fill="#5ff2df"/>
    <circle cx="68" cy="49" r="3.5" fill="#5ff2df"/>
    <path d="M49 55c4 5 16 5 21 0" fill="none" stroke="#eafffb" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M54 29v-7h8v7" fill="none" stroke="#7a8b96" stroke-width="3" stroke-linecap="round"/>
    <circle cx="58" cy="18" r="3" fill="#2ec4b6"/>
    <!-- A compact free arm balances the silhouette without human gender cues. -->
    <path d="M39 74 27 86c-4 4-4 11 1 14 5 3 10 2 14-2l10-11" fill="none" stroke="#94a6b1" stroke-width="11" stroke-linecap="round"/>
    <path d="M27 99c-4 0-7 4-5 8 2 4 8 5 11 1l4-6" fill="#2ec4b6" stroke="#0e625d" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <path d="M27 111h73" stroke="#2ec4b6" stroke-width="2" stroke-linecap="round" opacity=".45"/>
</svg>
