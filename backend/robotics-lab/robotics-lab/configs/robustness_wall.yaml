# Wall-geometry robustness experiment (v0.5.1): robustness_experiment.py.
#
# Each (variant, seed) is one episode. The wall of environments/planning_demo.xml is
# changed in code (MjSpec, `environment_overrides`; the XML is untouched) and the
# new geometry is KNOWN at the start of the episode: no perception, no replanning
# during motion. Per episode:
#   1. the plan made for the reference variant with the same seed (the "old plan")
#      is re-checked against the new geometry; it is never executed;
#   2. the planner is built from the new scene and plans again, at task creation;
#   3. each controller in `execution.controllers` executes the new plan in MuJoCo.
# Same start, target, planner settings and controllers in every episode.
#
# Nominal wall: body pos (0.525, 0, 0.53), half-sizes (0.275, 0.02, 0.13):
# x 0.25-0.80, y +-0.02, z 0.40-0.66. Variants were checked in
# docs/research/v0.5.1-demo-brief.md (start valid with 20 mm clearance in each).

environment: planning_demo
start: [0.246, 0.621, 0.211, -1.791, 0.089, 1.756, -0.785]   # configs/planning_demo.yaml
target: [0.45, -0.25, 0.50]                                  # right_of_wall
seeds: [0, 1, 2, 3, 4]
reference_variant: nominal     # the old plans come from this geometry

planning:                      # same as configs/benchmark_planning.yaml / planning_demo.yaml
  clearance: 0.02
  cartesian_step: 0.01
  max_joint_step: 0.05
  exact_box_box: true          # v0.5.2: box-box robot/obstacle pairs via mj_geomDistance (false = v0.5 contacts)
  joint_limit_margin: 0.05
  rrt: {step_size: 0.3, max_time: 5.0, max_nodes: 20000, max_iterations: 20000, try_direct: true}
  shortcut: {enabled: true, iterations: 100}
  ik: {random_seeds: 12, local_seeds: 8, time_split: true, max_candidates: 4, tolerance: 1.0e-4}
  segment_time: 1.0

execution:
  controllers:
    torque_mpc: {type: torque_mpc}     # v0.4 torque MPC (configs/default.yaml)
    torque_ctc: {type: torque_ctc}     # computed-torque control (500 Hz)
  hold_time: 1.0
  trajectory: {profile: min_jerk, velocity_scale: 0.9, acceleration_scale: 0.5, jerk_scale: 0.05, torque_scale: 0.8}
  clearance_monitor: 0.10      # m; robot-environment distances are measured up to this cap
  reach_tolerance: 0.001       # m; success = final EE error <= this and no robot contact

variants:
  nominal:
    description: "as in planning_demo.xml: x 0.25-0.80, y +-0.02, z 0.40-0.66"
    overrides: {}
  taller:
    description: "10 cm taller: top at z 0.76"
    overrides:
      bodies: {wall: {pos: [0.525, 0.0, 0.58]}}
      geoms: {wall: {size: [0.275, 0.02, 0.18]}}
  thicker:
    description: "8 cm thicker: y +-0.06"
    overrides:
      geoms: {wall: {size: [0.275, 0.06, 0.13]}}
  shifted:
    description: "moved 8 cm toward the goal: y -0.10 to -0.06"
    overrides:
      bodies: {wall: {pos: [0.525, -0.08, 0.53]}}
  longer:
    description: "15 cm longer: x 0.15-0.85"
    overrides:
      bodies: {wall: {pos: [0.50, 0.0, 0.53]}}
      geoms: {wall: {size: [0.35, 0.02, 0.13]}}
  taller_thicker:
    description: "taller and 6 cm thicker: z 0.40-0.76, y +-0.05"
    overrides:
      bodies: {wall: {pos: [0.525, 0.0, 0.58]}}
      geoms: {wall: {size: [0.275, 0.05, 0.18]}}
