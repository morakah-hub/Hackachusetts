# Cartesian reaching (v0.3): the arm resolves each end-effector target with
# inverse kinematics and moves there. Everything not listed here comes from
# default.yaml.
#
#   .\.venv\Scripts\python.exe main.py --config configs\reach.yaml --controller torque_mpc
#   .\.venv\Scripts\python.exe main.py --target 0.5 0.2 0.7      # ad-hoc target(s), any config

extends: default.yaml

task:
  type: cartesian_reach
  move_time: 3.0            # seconds per minimum-jerk move (joint space)
  hold_time: 1.5            # seconds holding each target
  trajectory:               # v0.4 feasibility-checked timing (same as default.yaml; the task section is replaced, not merged)
    profile: min_jerk
    velocity_scale: 0.9
    acceleration_scale: 0.5
    jerk_scale: 0.05
    torque_scale: 0.8
  ik:
    tolerance: 1.0e-4       # m; IK must reach the target this closely
    joint_limit_margin: 0.05
    damping: 0.05
  # Positions in metres, world frame. The robot base sits at (0, 0, 0.40) on
  # the table top (z = 0.40). Rejected targets are reported and skipped.
  targets:
    - name: front
      position: [0.50, 0.00, 0.70]
    - name: left_low
      position: [0.40, 0.35, 0.60]
    - name: right_high
      position: [0.45, -0.30, 0.85]
    - name: out_of_reach        # ~1.3 m from the base: intentionally unreachable
      position: [1.30, 0.00, 0.60]
    - name: inside_table        # below the table top: rejected by the collision check
      position: [0.50, 0.10, 0.38]
