# Motion-planning benchmark (v0.5): planning_benchmark.py.
#
# Part 1, planning only: every scenario is planned with every seed in `seeds`
# (no simulation). All seeds are reported, successful or not.
# Part 2, execution: scenarios with `execute: true` are planned again inside the
# normal runner and executed in MuJoCo by each controller in `execution.controllers`,
# for each seed in `execution.seeds`. Unchecked direct moves (planning disabled, no
# path check) are executed once per controller as a baseline where `unchecked_baseline`.
#
# Start configurations and targets were found experimentally
# (docs/research/v0.5-worklog.md); tests/test_planning_benchmark.py re-checks them.

seeds: 20                      # planning seeds 0 .. seeds-1 for part 1

planning:                      # base settings for every scenario (same as configs/planning_demo.yaml)
  clearance: 0.02
  cartesian_step: 0.01
  max_joint_step: 0.05
  exact_box_box: true          # v0.5.2: box-box robot/obstacle pairs via mj_geomDistance (false = v0.5 contacts)
  joint_limit_margin: 0.05
  rrt: {step_size: 0.3, max_time: 5.0, max_nodes: 20000, max_iterations: 20000, try_direct: true}
  shortcut: {enabled: true, iterations: 100}
  ik: {random_seeds: 12, local_seeds: 8, time_split: true, max_candidates: 4, tolerance: 1.0e-4}
  segment_time: 1.0

execution:
  seeds: [0, 1, 2]
  controllers:
    torque_mpc: {type: torque_mpc}     # v0.4 torque MPC (configs/default.yaml)
    torque_ctc: {type: torque_ctc}     # computed-torque baseline (500 Hz)
  hold_time: 1.0
  trajectory: {profile: min_jerk, velocity_scale: 0.9, acceleration_scale: 0.5, jerk_scale: 0.05, torque_scale: 0.8}
  clearance_monitor: 0.10      # m; robot-environment distances are measured up to this cap
  reach_tolerance: 0.001       # m; "reached" once the end effector stays this close to the target

scenarios:
  easy_free:                   # unobstructed: the straight joint move is free
    environment: table
    start: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]
    target: [0.50, 0.00, 0.70]
    execute: true

  wall:                        # the demo: straight move sweeps the hand through the wall
    environment: planning_demo
    start: [0.246, 0.621, 0.211, -1.791, 0.089, 1.756, -0.785]
    target: [0.45, -0.25, 0.50]
    execute: true
    unchecked_baseline: true

  obstacles_blocked:           # v0.3 test pair in the obstacles scene: hand would hit obstacle_1
    environment: obstacles
    start: [0.456, 0.927, 0.105, -1.269, 0.137, 2.437, -0.678]
    target: [0.70, 0.18, 0.52]
    execute: true
    unchecked_baseline: true

  narrow_passage:              # wall under a ceiling at z = 1.00: cross through the 34 cm gap
    environment: planning_narrow
    start: [0.81, 0.805, -0.476, -1.587, 0.453, 1.43, -2.33]
    target: [0.45, -0.25, 0.50]
    execute: true
    unchecked_baseline: true

  narrow_random_ik_only:       # same, with the v0.5 first-draft IK seeding (no local seeds)
    environment: planning_narrow
    start: [0.81, 0.805, -0.476, -1.587, 0.453, 1.43, -2.33]
    target: [0.45, -0.25, 0.50]
    planning: {ik: {local_seeds: 0}}

  multi_ik_near_obstacle:      # the v0.3 IK posture is 17 mm from obstacle_1: another posture is needed
    environment: obstacles
    start: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]
    target: [0.68, 0.42, 0.52]

  unreachable:                 # 1.3 m from the base
    environment: table
    start: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]
    target: [1.30, 0.00, 0.60]

  start_in_collision:          # hand inside the table top
    environment: table
    start: [0.101, 0.902, 0.073, -1.696, 0.029, 1.936, -0.785]
    target: [0.50, 0.00, 0.70]

  goal_in_collision:           # target inside the wall
    environment: planning_demo
    start: [0.246, 0.621, 0.211, -1.791, 0.089, 1.756, -0.785]
    target: [0.50, 0.00, 0.55]

  timeout:                     # joint goal across the wall with a 5 ms budget
    environment: planning_demo
    start: [0.246, 0.621, 0.211, -1.791, 0.089, 1.756, -0.785]
    goal: [-0.246, 0.621, -0.211, -1.791, -0.089, 1.756, -0.785]
    planning: {rrt: {max_time: 0.005}}

  node_budget:                 # same joint goal with an 8-node budget
    environment: planning_demo
    start: [0.246, 0.621, 0.211, -1.791, 0.089, 1.756, -0.785]
    goal: [-0.246, 0.621, -0.211, -1.791, -0.089, 1.756, -0.785]
    planning: {rrt: {max_nodes: 8}}
